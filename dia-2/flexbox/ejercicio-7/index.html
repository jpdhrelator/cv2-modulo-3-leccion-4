<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ejercicio 5</title>
        <style>
        .contenedor {
            display: flex;
            gap: 10px;
            height: 100px;
            border:1px solid #cbd5e1; 
            border-radius:6px;
            margin-bottom: 5px;
            align-items:center;
            justify-content: center;
        }
        .self-end{ align-self:flex-end; }
        .first{ order:-1; }
        .item {
            background:#db2777;
            color:#fff;
            padding:18px;
            border-radius:8px;
            font-weight:700;
            text-align:center; 
        }
    </style>
    </head>
    <body>

        <div class="contenedor ">
            <div class="item"> 1</div>
            <div class="item self-end"> 2</div>
            <div class="item"> 3</div>
        </div>

         <div class="contenedor ">
            <div class="item"> 1</div>
            <div class="item "> 2</div>
            <div class="item first"> 3</div>
        </div>


    </body>
</html>
