<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ejercicio 3</title>
        <style>
        .contenedor {
            display: flex;
            gap: 12px;
        }
        .jc-start {
            justify-content:flex-start; /*valor por defecto*/
        }
        .jc-center {
            justify-content: center; 
        }
        .jc-end    { 
            justify-content:flex-end; 
        }
        .jc-between {
            justify-content:space-between;
        }
        .jc-around {
            justify-content:space-around;
        }
        .jc-evenly {
            justify-content:space-evenly;
        }


        .item {
            background:#7c3aed;
            color:#fff;
            padding:18px;
            border-radius:8px;
            font-weight:700;
            text-align:center; 
        }
    </style>
    </head>
    <body>

        <div class="contenedor jc-start">
            <div class="item"> A</div>
            <div class="item"> B</div>
            <div class="item"> C</div>
        </div>

        <hr>
        <div class="contenedor jc-center">
            <div class="item"> A</div>
            <div class="item"> B</div>
            <div class="item"> C</div>
        </div>

        <hr>
        <div class="contenedor jc-end">
            <div class="item"> A</div>
            <div class="item"> B</div>
            <div class="item"> C</div>
        </div>

        <hr>
        <div class="contenedor jc-between">
            <div class="item"> A</div>
            <div class="item"> B</div>
            <div class="item"> C</div>
        </div>

        <hr>
        <div class="contenedor jc-around">
            <div class="item"> A</div>
            <div class="item"> B</div>
            <div class="item"> C</div>
        </div>

        <hr>
        <div class="contenedor jc-evenly">
            <div class="item"> A</div>
            <div class="item"> B</div>
            <div class="item"> C</div>
        </div>

    </body>
</html>
