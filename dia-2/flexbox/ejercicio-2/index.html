<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
    <style>
        .contenedor {
            display: flex;
            flex-direction:row;
            gap: 12px;
        }
        .contenedor-revers {
            display: flex;
            flex-direction:row-reverse;
            gap: 12px;
        }
        .contenedor-column {
            display: flex;
            flex-direction:column;
            gap: 12px;
        }
        .contenedor-column-reverse {
            display: flex;
            flex-direction:column-reverse;
            gap: 12px;
        }

        .item {
            background:#2563eb;
            color:#fff;
            padding:18px;
            border-radius:8px;
            font-weight:700;
            text-align:center; 
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <div class="item"> 1</div>
        <div class="item"> 2</div>
        <div class="item"> 3</div>
        <div class="item"> 4</div>
    </div>
    <hr>

     <div class="contenedor-revers">
        <div class="item"> 1</div>
        <div class="item"> 2</div>
        <div class="item"> 3</div>
        <div class="item"> 4</div>
    </div>

    <hr>

     <div class="contenedor-column">
        <div class="item"> 1</div>
        <div class="item"> 2</div>
        <div class="item"> 3</div>
        <div class="item"> 4</div>
    </div>
    <hr>

     <div class="contenedor-column-reverse">
        <div class="item"> 1</div>
        <div class="item"> 2</div>
        <div class="item"> 3</div>
        <div class="item"> 4</div>
    </div>
    
</body>
</html>
