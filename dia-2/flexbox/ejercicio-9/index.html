<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="page">
            <nav class="nav">
                <span class="brand">☕ Café Flex</span>
                <div class="links"><a href="#">Inicio</a><a href="#">Menú</a><a
                        href="#">Contacto</a></div>
            </nav>
            <header class="hero">
                <h2>El mejor café, servido con estilo</h2>
                <p>Tostado artesanal todos los días.</p>
                <a href="#" class="btn">Ver carta</a>
            </header>
            <section class="cards">
                <div class="card"><h3>Espresso</h3><p>Intenso y corto.</p><span
                        class="price">$2.0</span></div>
                <div class="card"><h3>Cappuccino</h3><p>Con espuma
                        cremosa.</p><span class="price">$3.0</span></div>
                <div class="card"><h3>Latte</h3><p>Suave y lechoso.</p><span
                        class="price">$3.5</span></div>
            </section>
            <footer class="foot">
                <span>© 2026 Café Flex</span>
                <span class="social">IG · X · FB</span>
            </footer>
        </div>
    </body>
</html>
