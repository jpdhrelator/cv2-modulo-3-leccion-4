<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ejercicio 4</title>
        <style>
        .contenedor {
            display:grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 70px;
            gap:10px;
        }
        .wide {
             grid-column: span 2;
             background:#db2777 !important;
        }
        .tall {
            grid-row: span 2;
            background:#f59e0b !important;
        }
        .item {
            background:#16a34a;
            color:#fff;
            padding:18px;
            border-radius:8px;
            font-weight:700;
            text-align:center; 
        }
    </style>
    </head>
    <body>

        <div class="contenedor">
            <div class="item wide">Ocupo 2 columnas (span 2)</div>
            <div class="item">2</div>
            <div class="item">3</div>
            <div class="item tall">Ocupo 2 filas</div>
            <div class="item">5</div>
            <div class="item">6</div>
        </div>

    </body>
</html>
