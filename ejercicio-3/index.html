<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ejercicio 1</title>
        <style>
           .bl {
            display: block;
            width: 300px; 
            height: 40px;
            background-color: #2563eb;
            color: #fff;
            margin-bottom: 5px;
           }
           .inl{
                display:inline;
                background:#16a34a;
                color: #fff;
                padding: 5px;
                width: 300px; 
                height: 40px;
            }
            .ib {
                display:inline-block;
                background:#db2777;
                color: #fff;
                width:150px;
                height:50px;
                margin:4px;
                padding: 5px;
            }
        </style>
    </head>
    <body>

        <div class="bl"> Caja 1</div>
        <div class="bl"> Caja 2</div>

        <hr>
        <div class="inl"> Caja 3</div>
        <div class="inl"> Caja 4</div>
        <div class="inl"> Caja 5</div>
        <div class="inl"> Caja 6</div>

        <hr>

        <div class="ib"> Caja 7</div>
        <div class="ib"> Caja 8</div>
        <div class="ib"> Caja 9</div>
        <div class="ib"> Caja 10</div>
    </body>
</html>
