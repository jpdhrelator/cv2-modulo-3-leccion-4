<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ejercicio 1</title>
        <style>
            .caja{
                    /* 1) CONTENIDO */
                    width: 220px;
                    height: 80px;

                     /* 2) PADDING — espacio interno */
                    padding: 20px;

                    /* 3) BORDER — el borde */
                    border: 8px solid #2563eb;

                    /* 4) MARGIN — separa de los vecinos */

                    background: #bfdbfe;
                }

                p {
                    border-style: solid;
                    border-width: 10px 20px 30px 40px;
                    border-color: red;
                    }
    </style>

        <div class="caja">
            contenido
        </div>
        <p>Otro</p>

    </body>
